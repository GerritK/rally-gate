; ESP32 NFC check-in gate, see docs/esp32-gate.md.
;   pio run -e xiao_esp32s3 -t upload    build and flash over USB
;   pio device monitor                   serial log
;   pio test -e native                   gate_core tests on the host (needs gcc)

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
; Pinned: the official platform ships Arduino core 2.x (ESP-IDF 4.4), and
; uplink.cpp uses esp-mqtt's 4.4 flat config struct, which 3.x nests.
platform = espressif32 @ 6.9.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:prebuild.py
lib_deps =
    adafruit/Adafruit PN532 @ 1.3.4
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_build_src = no
