name: Standalone packages

# One runner per OS because better-sqlite3 is a native addon: each package
# carries the node binary and prebuilt addon of the machine that built it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; there is no Intel Mac build.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The node running the packaging script is the one that ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:shared
      - run: npm run build --workspace=@rally-gate/rally-server --workspace=@rally-gate/web

      - run: node scripts/package-standalone.js

      # Starts the packaged folder with its own node, so a missing module or an
      # addon built for the wrong ABI fails here rather than on a marshal's laptop.
      # Then creates an event, which only works if start.js restarts the server.
      - name: Smoke test
        shell: bash
        run: |
          dir=$(ls -d dist-standalone/rally-gate-*/ | head -1)
          OPEN_BROWSER=0 EVENTS_DIR="$RUNNER_TEMP/events" "$dir/node" "$dir/app/start.js" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          up() {
            for _ in $(seq 1 60); do
              if curl -fsS http://localhost:57430/api/event | grep -q "$1" &&
                 curl -fsS http://localhost:57430/setup/stages | grep -q '<div id="app"'; then
                return 0
              fi
              sleep 1
            done
            cat "$RUNNER_TEMP/smoke.log"
            return 1
          }
          up rally-gate.sqlite
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"Smoke","date":"2026-01-01"}' http://localhost:57430/api/event
          up '2026-01-01 Smoke.sqlite'
          echo "packaged rally-server is up and switches events"

      # Zipped (the default): the release job's download of an unzipped .tar.gz
      # fails on its checksum.
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            dist-standalone/*.zip
            dist-standalone/*.tar.gz
          if-no-files-found: error

  # One image per supported board, merged from offset 0 (bootloader, partition
  # table, boot_app0, app) so esptool or the browser flasher writes one file.
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32-gate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe in prebuild.py needs the tags
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -e xiao_esp32s3
      - run: |
          b=.pio/build/xiao_esp32s3
          mkdir -p "$GITHUB_WORKSPACE/dist-firmware"
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o "$GITHUB_WORKSPACE/dist-firmware/rally-gate-$(git describe --tags --always | sed "s/^v//")-esp32-xiao-s3.bin" \
            0x0 $b/bootloader.bin 0x8000 $b/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $b/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist-firmware/*.bin
          if-no-files-found: error

  release:
    needs: [package, firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history with tags, for the commits since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: |
          for script in install-gate-pi.sh install-server-pi.sh; do
            sed "s/^RELEASE=.*/RELEASE=\"\${RELEASE:-$GITHUB_REF_NAME}\"/" "deploy/$script" > "dist/$script"
            grep -qx "RELEASE=\"\${RELEASE:-$GITHUB_REF_NAME}\"" "dist/$script"
          done
      # A suffixed tag (v0.2.0-rc.1) is a pre-release, which /releases/latest/ skips.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Alpha.** Breaking changes can happen in any release: an event file from an older version may not open in a newer one. Finish an event on the version you started it with, and keep a paper backup."
            echo
            if prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null); then
              echo "## Changes since $prev"
              echo
              git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" | grep -Ev '^- (Docs|Roadmap):' || true
            else
              echo "First release. What it does: [What works today](https://github.com/$GITHUB_REPOSITORY#what-works-today)."
            fi
          } > notes.md
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"

  # The browser flasher (firmware/esp32-gate/install) with the latest release's
  # image. GitHub Pages, because Web Serial needs HTTPS and release assets
  # can't be fetched cross-origin.
  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: firmware
          path: site
      - run: |
          cp firmware/esp32-gate/install/index.html site/
          cp -r firmware/esp32-gate/web/fonts site/
          bin=$(cd site && ls *-esp32-xiao-s3.bin)
          cat > site/manifest.json <<JSON
          {
            "name": "Rally Gate ESP32 gate",
            "version": "$GITHUB_REF_NAME",
            "new_install_prompt_erase": true,
            "builds": [{ "chipFamily": "ESP32-S3", "parts": [{ "path": "$bin", "offset": 0 }] }]
          }
          JSON
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
