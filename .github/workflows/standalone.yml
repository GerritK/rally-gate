name: Standalone packages

# One runner per OS because better-sqlite3 is a native addon: each package
# carries the node binary and prebuilt addon of the machine that built it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; there is no Intel Mac build.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The node running the packaging script is the one that ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:shared
      - run: npm run build --workspace=@rally-gate/rally-server --workspace=@rally-gate/web

      - run: node scripts/package-standalone.js

      # Starts the packaged folder with its own node, so a missing module or an
      # addon built for the wrong ABI fails here rather than on a marshal's laptop.
      # Then creates an event, which only works if start.js restarts the server.
      - name: Smoke test
        shell: bash
        run: |
          dir=$(ls -d dist-standalone/rally-gate-*/ | head -1)
          OPEN_BROWSER=0 EVENTS_DIR="$RUNNER_TEMP/events" "$dir/node" "$dir/app/start.js" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          up() {
            for _ in $(seq 1 60); do
              if curl -fsS http://localhost:57430/api/event | grep -q "$1" &&
                 curl -fsS http://localhost:57430/setup/stages | grep -q '<div id="app"'; then
                return 0
              fi
              sleep 1
            done
            cat "$RUNNER_TEMP/smoke.log"
            return 1
          }
          up rally-gate.sqlite
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"Smoke","date":"2026-01-01"}' http://localhost:57430/api/event
          up '2026-01-01 Smoke.sqlite'
          echo "packaged rally-server is up and switches events"

      # archive: false, or GitHub zips the zip again on download. The file
      # name becomes the artifact name.
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |
            dist-standalone/*.zip
            dist-standalone/*.tar.gz
          if-no-files-found: error

  # Tag pushes only: a manual run is for trying the packages, not publishing them.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # A tag with a suffix (v0.1.0-alpha.1) is a pre-release.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            --notes "**Alpha.** Breaking changes can happen in any release: an event file from an older version may not open in a newer one. Finish an event on the version you started it with, and keep a paper backup."
