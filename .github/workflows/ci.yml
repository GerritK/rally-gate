name: CI

# The install path for this project is `curl | bash` straight off master
# (deploy/install-*.sh), so master being green is load-bearing rather than
# cosmetic — a broken commit is one a marshal can pull onto a Pi at an event.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22 to match what actually gets deployed: node:22-alpine in both
      # Dockerfiles, and setup_22.x in deploy/install-gate-pi.sh.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The other three workspaces import shared's *compiled* output, not its
      # source, so nothing below can typecheck until this has run.
      - name: Build shared
        run: npm run build:shared

      # Check-only variants throughout: the repo's own `lint` script passes
      # --fix, which in CI would quietly repair the tree and report success
      # while the committed code stays unformatted.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check --workspace=@rally-gate/rally-server

      - name: Tests
        run: npm test --workspace=@rally-gate/rally-server

      # Builds every workspace, which is what runs vue-tsc over apps/web —
      # the frontend has no test suite, so this is its only typecheck.
      - name: Build all workspaces
        run: npm run build

  # The headless stack is the one path neither the tests nor a local dev loop
  # can exercise. TypeORM connects before it validates entity metadata, so a
  # Postgres-invalid column type cannot fail until Postgres is actually
  # reachable — never under DB_TYPE=sqlite, and in Docker only as a
  # restart loop. This is the automated form of the "run docker compose up and
  # confirm it reaches listening" check in CLAUDE.md. It also covers the
  # Dockerfiles themselves, which nothing else builds.
  headless-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Wait for rally-server to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:57430/ >/dev/null 2>&1; then
              echo "rally-server is up against Postgres"
              exit 0
            fi
            sleep 2
          done
          echo "::error::rally-server never came up"
          docker compose -f deploy/docker-compose.yml logs --no-color
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
