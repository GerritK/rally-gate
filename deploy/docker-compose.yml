services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rally
      # Override with DB_PASSWORD in the environment (or a .env beside this
      # file) for anything beyond a closed rally network.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rally}
      POSTGRES_DB: rally_gate
    # Bound to loopback explicitly, never to 0.0.0.0. rally-server runs on the
    # host network (see below) so it can no longer reach Postgres by service
    # name, but only the host itself needs to — a bare "5432:5432" would put the
    # event database on the whole rally WiFi, which is what this used to avoid by
    # publishing nothing at all. The address prefix is the entire protection
    # here, so don't drop it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally -d rally_gate"]
      interval: 5s
      timeout: 5s
      retries: 10

  rally-server:
    build:
      context: ..
      dockerfile: apps/rally-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        # Wait for Postgres to actually accept connections, not merely to have
        # been created. TypeORM connects *before* it validates entity metadata,
        # so starting too early turns a clean failure into a restart loop.
        condition: service_healthy
    # Host networking, not bridge, so the mDNS advertisement actually reaches
    # gates: a bridged container can neither send nor receive LAN multicast, so
    # DiscoveryService would advertise into the Docker bridge and no gate would
    # ever see it — leaving headless deployments needing a typed-in address, the
    # one thing it exists to remove. See "Server discovery" in
    # docs/architecture.md.
    #
    # Consequences, both load-bearing: the service publishes no ports (on the
    # host network it already listens on 57430/57431/57432 directly), and it
    # reaches Postgres over loopback instead of by service name.
    network_mode: host
    environment:
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: rally
      DB_PASSWORD: ${DB_PASSWORD:-rally}
      DB_NAME: rally_gate
      PORT: 57430
      MQTT_PORT: 57431
      NTP_PORT: 57432

volumes:
  postgres-data:
